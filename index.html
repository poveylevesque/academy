<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PLPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    .container {
      max-width: 520px;
      text-align: center;
    }

    /* LOGO */
    img {
      max-width: 110px;
      margin-bottom: 30px;
      opacity: 0.95;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 18px;
    }

    /* CTA BUTTON */
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    a.button:hover {
      transform: translateY(-1px);
      background: #333;
    }

    /* INSTAGRAM LINK */
    .instagram {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .instagram:hover {
      border-bottom-color: #e1306c;
      color: #e1306c;
    }

    /* SMALL TEXT STYLE */
    .small {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <img src="logo.png" alt="Logo">

    <!-- TITLE -->
    <h1>Povey Levesque Painting Academy</h1>

    <!-- TEXT -->
    <p>
      7-day mentoring program with Edward Povey & Suzanne Levesque in the coastal village of Instow, Devon.
    </p>

    <p class="small">
      A focused immersion into painting, perception and artistic practice.
    </p>

    <!-- INSTAGRAM -->
    <p class="small">
      Follow us on 
      <a class="instagram" href="https://www.instagram.com/poveylevesque_academy/" target="_blank">
        Instagram
      </a>
    </p>

    <!-- CTA -->
    <a class="button" href="mailto:academy@plpa.space">
      Apply for Sept ’26
    </a>

  </div>

</body>
</html>
