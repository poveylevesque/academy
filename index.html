<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PLPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    /* WHITE CARD */
    .container {
      background: #fff;
      padding: 60px 50px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    img {
      max-width: 110px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 16px;
    }

    .small {
      font-size: 14px;
      color: #666;
    }

    /* INSTAGRAM */
    .instagram {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.25);
      transition: all 0.2s ease;
    }

    .instagram:hover {
      color: #e1306c;
      border-bottom-color: #e1306c;
    }

    /* BUTTON */
    a.button {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    a.button:hover {
      background: #333;
      transform: translateY(-1px);
    }

    /* subtle spacing rhythm */
    .spacer {
      height: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="logo2.png" alt="Logo">

    <h1>Povey Levesque Painting Academy</h1>

    <p>
      7-day mentoring program with Edward Povey & Suzanne Levesque in the coastal village of Instow, Devon.
    </p>
    

    <a class="button" href="mailto:academy@plpa.space">
      Apply for Sept ’26
    </a>
<br>
<p class="small">
      Follow us on
      <a class="instagram" href="https://www.instagram.com/poveylevesque_academy/" target="_blank">
        Instagram
      </a>
    </p>
    
  </div>

</body>
</html>
