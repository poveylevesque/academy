<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PLPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    img {
      max-width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 25px;
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.2s;
    }

    a.button:hover {
      background: #333;
    }

    /* INSTAGRAM LINK */
    .instagram {
      color: inherit;
      text-decoration: underline;
      transition: color 0.25s ease;
    }

    .instagram:hover {
      color: #e1306c;
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="logo.png" alt="Logo">

    <h1>Povey Levesque Painting Academy</h1>

    <p>
      7-day mentoring program with Edward Povey & Suzanne Levesque in the quaint coastal village of Instow in Devon, England.
    </p>

    <p>
      Follow us on
      <a class="instagram" href="https://www.instagram.com/poveylevesque_academy/" target="_blank">
        Instagram
      </a>
    </p>

    <p>Apply now for Sept’26.</p>

    <a class="button" href="mailto:academy@plpa.space">
      Apply
    </a>

  </div>
</body>
</html>
